spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cm_taskService
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.codemania.task_service: DEBUG
    org.springframework.web: DEBUG