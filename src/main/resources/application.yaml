spring:
  application:
    name: task-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/dummy
    username: dummy
    password: dummy
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: kafka:9092
#    bootstrap-servers: localhost:9092 #для локального запуска приложения
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false
      retries: 3
      acks: 1
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: true
  data:
    redis:
      host: localhost  # Для локального запуска (будет переопределено в docker)
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.codemania.task_service: DEBUG
    org.springframework.web: DEBUG

scheduled:
  interval:
    send-pending: 60000
