spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cm_taskService
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: kafka:9092
#    bootstrap-servers: localhost:9092 #для локального запуска приложения
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      retries: 3
      acks: 1

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.codemania.task_service: DEBUG
    org.springframework.web: DEBUG